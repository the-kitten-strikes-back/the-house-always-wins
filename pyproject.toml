[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exodus"
version = "0.1.0"
description = "Civilisation simulation engine for galaxies, factions, wars, and technology evolution."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sidharth Banglani" }]
dependencies = []

[project.optional-dependencies]
viz = ["pygame>=2.5,<3"]

[project.scripts]
exodus = "exodus.cli:main"
exodus-viz = "exodus.visualization.app:main"
exodus-casino = "exodus.visualization.casino:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
